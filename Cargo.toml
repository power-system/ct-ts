[package]
name = "ct-ts"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"

description = "Threshold Schnorr signatures (FROST, RFC 9591) — protocol core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/power-system/ct-ts"
readme = "README.md"
keywords = ["frost", "threshold", "schnorr", "cryptography"]
categories = ["cryptography"]

[dependencies]
ct-scalar = { version = "0.0.2", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.1", features = ["derive"], default-features = false }
rand_core = { version = "0.10.1", default-features = false }

[dev-dependencies]
hex = "0.4.3"
rand = { version = "0.10.4", features = ["std", "std_rng", "sys_rng"] }
